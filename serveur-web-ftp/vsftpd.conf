# ==========================================================================
#  vsftpd : serveur FTP(S) avec utilisateurs virtuels (labo TSPCR)
#  À placer dans /etc/vsftpd.conf
#
#  Les comptes virtuels sont gérés par gestion-apache-ftp.sh et vérifiés
#  par PAM (voir pam.d-vsftpd). Ils travaillent tous sous le compte local
#  "ftp" et chacun est enfermé dans son dossier /var/www/<nom>.
#
#  Corrections par rapport à la version d'origine (voir README) :
#   - le commentaire du chroot était inversé (voir plus bas)
#   - FTPS rendu obligatoire : les mots de passe ne circulent plus en clair
#   - pasv_address documentée : c'est l'IP PUBLIQUE quand le serveur est derrière un NAT
# ==========================================================================

# Port d'écoute
listen_port=21

# Message de bienvenue
ftpd_banner= ][ WEBserver - FTP Service ][

# Fichier de config PAM (/etc/pam.d/vsftpd) : c'est lui qui vérifie les comptes virtuels
pam_service_name=vsftpd

# Mode autonome (vsftpd tourne comme un service, sans inetd)
listen=YES

# Pas de connexions anonymes
anonymous_enable=NO

# Les comptes virtuels sont vus comme des "utilisateurs locaux" par vsftpd :
# cette option doit donc rester active, même s'il n'y a pas de vrai compte Linux
local_enable=YES

# Liste des comptes interdits (userlist_deny vaut YES par défaut : la liste = les refusés)
userlist_enable=YES
userlist_file=/etc/vsftpd/BannedUsers.list

# Pas d'écriture par défaut ; elle est rouverte compte par compte
# dans /etc/vsftpd/vsftpdUsers/<nom> (write_enable=YES)
write_enable=NO

# Droits des fichiers déposés par les comptes virtuels (644 / 755)
anon_umask=022

# Valeurs par défaut pour les comptes virtuels (ouvertes compte par compte)
anon_upload_enable=NO
anon_mkdir_write_enable=NO
anon_other_write_enable=NO

# Chroot : chaque utilisateur est enfermé dans son dossier.
# ATTENTION, piège classique : avec chroot_local_user=YES, la liste
# chroot_list_file contient les utilisateurs qui NE SONT PAS enfermés
# (les exceptions). L'ancien commentaire disait l'inverse.
# Laissez ce fichier vide pour enfermer tout le monde.
chroot_local_user=YES
chroot_list_enable=YES
chroot_list_file=/etc/vsftpd/vsftpd.chroot.list
# Nécessaire car le dossier du chroot appartient au compte qui y écrit
allow_writeable_chroot=YES

# Nombre de connexions simultanées
max_clients=50
max_per_ip=10

# Journal des transferts (/var/log/vsftpd.log)
xferlog_enable=YES

# Les comptes virtuels ("guests") utilisent tous le compte local "ftp"
guest_enable=YES
guest_username=ftp

# Dossier des réglages par compte (créés par gestion-apache-ftp.sh)
user_config_dir=/etc/vsftpd/vsftpdUsers

# FTPS : chiffrement TLS.
# force_*=YES : connexion ET transferts chiffrés obligatoires. Avec NO (ancienne
# version), un client pouvait se connecter en FTP simple et le mot de passe
# passait en clair sur le réseau. FileZilla : "FTP explicite sur TLS".
ssl_enable=YES
allow_anon_ssl=NO
force_local_data_ssl=YES
force_local_logins_ssl=YES

# Paramètres SSL : anciens protocoles SSLv2/SSLv3 désactivés
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
require_ssl_reuse=NO
ssl_ciphers=HIGH

# Mode passif (indispensable derrière un pare-feu / NAT).
# pasv_address = adresse que le CLIENT doit joindre : l'IP publique du
# pare-feu si le serveur est derrière un NAT (sinon l'IP du serveur).
# La plage de ports doit être ouverte et redirigée sur le pare-feu
# (FTP_PASSIF dans firewall/firewall-apache-lan.sh).
pasv_enable=YES
pasv_address=192.168.18.26
pasv_min_port=40000
pasv_max_port=50000

# Certificat (auto-signé pour le labo) :
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/vsftpd.key -out /etc/ssl/certs/vsftpd.crt
rsa_cert_file=/etc/ssl/certs/vsftpd.crt
rsa_private_key_file=/etc/ssl/private/vsftpd.key
